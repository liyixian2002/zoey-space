<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李奕羡 · 3D 个人空间</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scene-container"></div>

    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="avatar">李</div>
            <div class="top-info">
                <h1>李奕羡</h1>
                <p>产品经理 · 探索我的数字小屋</p>
            </div>
        </div>
    </header>

    <div class="hint-bar">
        <span class="hint-tag">🖱️ 拖拽旋转</span>
        <span class="hint-tag">🔍 滚轮缩放</span>
        <span class="hint-tag">👆 点击物件</span>
    </div>

    <aside id="info-panel" class="info-panel">
        <button class="panel-close" id="panel-close">&times;</button>
        <div class="panel-header">
            <span class="panel-emoji" id="panel-emoji"></span>
            <h2 class="panel-title" id="panel-title"></h2>
        </div>
        <div class="panel-content" id="panel-content"></div>
    </aside>

    <nav class="nav-grid" id="nav-grid"></nav>

    <div id="loader" class="loader">
        <div class="loader-room">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>
        <p>正在搭建空间...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
